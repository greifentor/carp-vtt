openapi: '3.0.3'
info:
  title: Battle Map Service API
  version: 1.0.0

security:
  - bearerAuth: []

paths:
  /api/v1/battle-maps:
    put:
      tags:
        - BattleMap
      summary: Update a battle map
      operationId: updateBattleMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BattleMapDto'
      responses:
        '200':
          description: Battle map updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleMapDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    delete:
      tags:
        - BattleMap
      summary: Remove a battle map
      operationId: removeBattleMap
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Battle Map removed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/images/scenarios/{scenarioId}/parties/{partyId}/battlemaps/{battleMapId}:
    get:
      tags:
        - Image
      summary: Download the current battle map for the passed party, scenario and battle map.
      operationId: getBattleMapRendered
      parameters:
        - name: battleMapId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Battle map image for the sceanrio, party and battle map combination.
          content:
            application/jpeg:
              schema:
                type: string
                format: binary
            application/png:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/images/scenarios:
    get:
      tags:
        - List scenario image data
      summary: Download a list of scenario image data.
      operationId: findAllScenarioImageData
      responses:
        '200':
          description: Delivers a list with the data of all available scenario images (not the images itself).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageInfoDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/parties/{id}:
    delete:
      tags:
        - Party
      summary: Remove a party
      operationId: removeParty
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Party removed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/parties:
    put:
      tags:
        - Party
      summary: Update a party
      operationId: updateParty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyDto'
      responses:
        '200':
          description: Party updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/scenarios/{id}:
    delete:
      tags:
        - Scenario
      summary: Remove a scenario
      operationId: removeScenario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Scenario removed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/scenarios:
    put:
      tags:
        - Scenario
      summary: Update a scenario
      operationId: updateScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioDto'
      responses:
        '200':
          description: Scenario updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/tokens:
    delete:
      tags:
        - Token
      summary: Remove a token
      operationId: removeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenDto'
      responses:
        '200':
          description: Token removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    put:
      tags:
        - Token
      summary: Update a token
      operationId: updateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenDto'
      responses:
        '200':
          description: Token updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/tokens/positions/{id}:
    delete:
      tags:
        - Token-Position
      summary: Delete a tokens position
      operationId: deleteTokenPosition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Removes a token position with the passed id.
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/tokens/positions:
    put:
      tags:
        - Token-Position
      summary: Update a tokens position
      operationId: updateTokenPosition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPositionDto'
      responses:
        '200':
          description: Token Position updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPositionDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/unselect/scenario/{scenarioId}/parties/{partyId}/battlemaps/{battleMapId}:
    put:
      tags:
        - Unselect
      summary: Unselects the token for scenario, party and battle map.
      operationId: unselect
      parameters:
        - name: battleMapId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token for scenario, party and battle map is unselected.
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /api/v1/users/rights/{id}:
    get:
      tags:
        - User-Rights
      summary: Gets the users rights
      operationId: getUserRights
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Returns the rights for the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BattleMapDto:
      type: object
      required:
        - id
        - name 
        - imageContent
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "orc-ambush-map"
        image:
          type: string
          format: byte
          description: Base64-encoded image content
          example: "iVBORw0KGgoAAAANSUhEUgAA..."
    DndDataDto:
      type: object
      required:
        - currentHitPoints
        - maxHitPoints
      properties:
        currentHitPoints:
          type: integer
          format: int32
          example: 4711
        maxHitPoints:
          type: integer
          format: int32
          example: 4711
    ImageInfoDto:
      type: object
      properties:
        name:
          type: string
          example: "a name"
        url:
          type: string
          example: "/bla/bla/4711"
    PartyDto:
      type: object
      required:
        - id
        - name 
        - ruleSystem
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "orc-ambush-party"
        ruleSystem:
          $ref: '#/components/schemas/RuleSystemDto'
        owner:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
    RuleSystemDto:
      type: string
      enum:
        - DND
        - NONE
    ScenarioDto:
      type: object
      required:
        - id
        - name 
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "orc-ambush-scenario"
        owner:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
    TokenDto:
      type: object
      required:
        - id
        - name
        - imageContent
        - tokenSize
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "orc-ambush-map"
        imageContent:
          type: string
          format: byte
          description: Base64-encoded image content
          example: "iVBORw0KGgoAAAANSUhEUgAA..."
        owner:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        tokenSize:
          $ref: '#/components/schemas/TokenSizeDto'
    TokenSizeDto:
      type: string
      enum:
        - TINY
        - SMALL
        - MEDIUM
        - LARGE
        - HUGE
        - GARGANTUAN
    TokenPositionDto:
      type: object
      required:
        - id
        - battleMapId
        - partyId
        - scenarioId
        - tokenId
        - coordinateX
        - coordinateY
        - counter
        - selected
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        battleMapId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        partyId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        scenarioId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        tokenId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        coordinateX:
          type: integer
          format: int32
          example: 4711
        coordinateY:
          type: integer
          format: int32
          example: 1701
        counter:
          type: integer
          format: int32
          example: 4711
        selected:
          type: boolean
          example: false
        dndData:
          $ref: '#/components/schemas/DndDataDto'
    TokenPositionIdDto:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
    ErrorDto:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "The provided BattleMapDto is invalid."
